<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d5aa7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>StockBook Hardware Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;600&display=swap">
<style>
/* Layout: one phone-width app column, sticky header, bottom tab bar; stock rows are scanned, not read. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --sunk:#e4e9ee; --ink:#13202b; --muted:#5a6a77; --line:#d6dee5;
  --accent:#0d5aa7; --accent-soft:#dbe8f6; --on-accent:#ffffff;
  --in:#1d7f47; --in-soft:#dcf1e4; --out:#b8420f; --out-soft:#fbe6da;
  --low:#a86a00; --low-soft:#fbefd2; --crit:#bf2430; --crit-soft:#f9dcde; --idle:#5b5fc7; --idle-soft:#e5e5f8;
  --shadow:0 1px 2px rgba(19,32,43,.06),0 4px 14px rgba(19,32,43,.06); --in-solid:#1d7f47; --out-solid:#b8420f;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#17212b; --sunk:#1e2a35; --ink:#e6edf3; --muted:#93a4b3; --line:#283744;
  --accent:#5aa2ee; --accent-soft:#183552; --on-accent:#08131e;
  --in:#5cc98a; --in-soft:#173527; --out:#f08a5b; --out-soft:#3b2216;
  --low:#e9b44c; --low-soft:#3a2d10; --crit:#f2747c; --crit-soft:#3d1a1d; --idle:#a5a8f5; --idle-soft:#26284a;
  --shadow:0 1px 2px rgba(0,0,0,.3); --in-solid:#1e6e40; --out-solid:#a8441a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#17212b; --sunk:#1e2a35; --ink:#e6edf3; --muted:#93a4b3; --line:#283744;
  --accent:#5aa2ee; --accent-soft:#183552; --on-accent:#08131e;
  --in:#5cc98a; --in-soft:#173527; --out:#f08a5b; --out-soft:#3b2216;
  --low:#e9b44c; --low-soft:#3a2d10; --crit:#f2747c; --crit-soft:#3d1a1d; --idle:#a5a8f5; --idle-soft:#26284a;
  --shadow:0 1px 2px rgba(0,0,0,.3); --in-solid:#1e6e40; --out-solid:#a8441a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.shop{min-width:0;flex:1}
.shop b{display:block;font:700 17px/1.15 var(--f-display);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop span{font-size:12px;color:var(--muted)}
.iconbtn{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--crit);color:#fff;font:600 11px/19px var(--f-body);text-align:center}
.demo{background:var(--accent-soft);color:var(--ink);font-size:12.5px}
.demo .wrap{padding-block:7px;display:flex;gap:8px;align-items:center}

main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:18px}
h2{font:700 13px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13.5px;padding:4px 0}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
button.kpi:hover{border-color:var(--accent)}
.kpi .v{font:800 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.low .v{color:var(--low)} .kpi.idle .v{color:var(--idle)} .kpi.crit .v{color:var(--crit)}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{border:0;border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;font-weight:600}
.big small{display:block;font-weight:400;font-size:12px;opacity:.85}
.big.in{background:var(--in-solid);color:#fff} .big.out{background:var(--out-solid);color:#fff}
.big svg{flex:none}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
button.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .r{text-align:right;flex:none}
.qty{font:800 19px/1 var(--f-display);font-variant-numeric:tabular-nums}
.qty small{font:500 11px var(--f-body);color:var(--muted);margin-left:2px}
.empty{padding:22px 14px;color:var(--muted);text-align:center;font-size:14px}

.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;letter-spacing:.01em}
.p-ok{background:var(--in-soft);color:var(--in)} .p-low{background:var(--low-soft);color:var(--low)}
.p-out{background:var(--crit-soft);color:var(--crit)} .p-idle{background:var(--idle-soft);color:var(--idle)}
.p-in{background:var(--in-soft);color:var(--in)} .p-outw{background:var(--out-soft);color:var(--out)}
.brand{font-weight:600;color:var(--ink);opacity:.8}

.tx{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;font:800 13px var(--f-display)}
.tx.in{background:var(--in-soft);color:var(--in)} .tx.out{background:var(--out-soft);color:var(--out)}

/* toolbar */
.toolbar{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 12px}
.search input{border:0;background:none;outline:none;padding:11px 0;flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{font-variant-numeric:tabular-nums;opacity:.75;margin-left:4px}
.count{font-size:12.5px;color:var(--muted)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-block:0}
nav.tabs button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);position:relative}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs .dot{position:absolute;top:4px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--crit)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,18,25,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:6px 0 calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-radius:16px;max-height:86vh}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 4px}
.sheet .inner{padding:8px 20px 0;display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font:700 20px/1.2 var(--f-display);text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:-8px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:11px;padding:4px;gap:4px}
.seg button{border:0;border-radius:8px;padding:9px;background:none;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"].in{background:var(--in-solid);color:#fff}
.seg button[aria-pressed="true"].out{background:var(--out-solid);color:#fff}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:600;flex:1}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.danger.solid{background:var(--crit);color:#fff}
.btn.sm{padding:8px 12px;flex:none;font-size:13.5px}
.picked{display:flex;gap:10px;align-items:center;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.picked .main{flex:1;min-width:0}
.picklist{border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--sunk);border-radius:10px;padding:10px}
.fact .l{font-size:11.5px;color:var(--muted)} .fact .v{font:700 17px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.err{color:var(--crit);font-size:13px;font-weight:500}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--muted)}
.note b{color:var(--ink)}
.confirm{border:1px solid var(--crit);background:var(--crit-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}

.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line)}
.timer .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;flex-wrap:wrap;width:100%}
.timer .left{display:flex;align-items:baseline;gap:8px;min-width:0}
.timer .cd{font:800 16px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--low)}
.timer .lbl{font-size:12.5px;color:var(--muted)}
.timer.urgent .cd{color:var(--crit)}
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lock .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.lock h3,.contact h3{margin:0;font:800 22px/1.2 var(--f-display);text-wrap:balance}
.phone{font:800 26px/1.1 var(--f-display);letter-spacing:.02em;font-variant-numeric:tabular-nums;user-select:all}
.cbtn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:13px 16px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.cbtn.wa{background:var(--in-solid);border-color:var(--in-solid);color:#fff}
.cbtn.call{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.warn{background:var(--low);color:#fff}
footer{text-align:center;color:var(--muted);font-size:12px;padding:8px 0 4px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

</head>

<header class="top">
  <div class="wrap">
    <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></div>

const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const iso = ts => { const d = new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const parseIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d).getTime(); };
const fmtDate = s => new Date(parseIso(s)).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const rupee = n => "₹" + Math.round(n).toLocaleString("en-IN");
const rupeeShort = n => n >= 1e7 ? "₹"+(n/1e7).toFixed(2)+" Cr" : n >= 1e5 ? "₹"+(n/1e5).toFixed(2)+" L" : rupee(n);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const daysAgo = s => Math.round((today0() - parseIso(s)) / DAY);
function rng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function fixCat(b, c, n){
  c = c.replace(/\s+/g," ").trim().replace("Acrilic","Acrylic");
  if(b==="Sika"){
    if(/^Sikacim \d/i.test(n)) return "Sikacim";
    if(c==="Super /Sbr = Urp") return "Sikalatex Super";
    if(c==="Power /Sbr") return "Sika Latex Power";
    if(c==="Sbr") return "Sika Latex SBR";
  }
  return c;
}

/* ---------- demo seed ---------- */
function seed(){
  const r = rng(20261112), t0 = today0();
  const day = n => iso(t0 + n*DAY);
  const customers = ["Walk-in customer","Walk-in customer","Walk-in customer","Sri Murugan Builders","Lakshmi Constructions","Ravi Contractor","Anna Nagar site","Selvam Waterproofing"];
  let seq = 1, txns = [];
  const products = RAW.map((p,i) => {
    const cost = p.cp;
    return { id:"p"+(i+1), brand:p.b, cat:fixCat(p.b,p.c,p.n), name:p.n, size:p.s||"", unit:"Nos",
      cost, price:p.sp, min: cost > 4000 ? 2 : cost > 1000 ? 3 : 5 };
  });
  const add = (pid,type,qty,date,party,bill,note) => txns.push({id:"t"+(seq++),pid,type,qty,date,party,bill,note:note||""});
  products.forEach(p => {
    const sup = p.brand==="Sika" ? "Sika India – Chennai distributor" : "Pidilite (Dr. Fixit) distributor";
    let stock = p.min*3 + Math.floor(r()*p.min*4) + 3;
    add(p.id,"IN",stock,day(-62 + Math.floor(r()*4)),sup,"OPN-"+(100+seq),"Opening stock");
    const x = r();
    if(x < 0.07) return;                          // never sold → not moving
    const stopped = x < 0.13, fast = x > 0.92;
    const n = fast ? 6 + Math.floor(r()*5) : 2 + Math.floor(r()*6);
    const days = Array.from({length:n}, () => stopped ? -57 + Math.floor(r()*20) : -55 + Math.floor(r()*56)).sort((a,b)=>a-b);
    let restocked = false;
    for(const d of days){
      let q = 1 + Math.floor(r()*(fast?4:3)); if(q > stock) q = stock; if(q <= 0) break;
      stock -= q; add(p.id,"OUT",q,day(d),customers[Math.floor(r()*customers.length)],"B-"+(2400+seq));
      if(!fast && !restocked && stock <= p.min && d < -10 && r() < .7){
        const q2 = p.min*2 + Math.floor(r()*4); stock += q2; restocked = true;
        add(p.id,"IN",q2,day(d+3),sup,"INV-"+(5100+seq));
      }
    }
    if(fast && stock > p.min){ const q = stock - Math.floor(r()*(p.min+1)); if(q>0){ stock -= q; add(p.id,"OUT",q,day(-1 - Math.floor(r()*3)),customers[3+Math.floor(r()*4)],"B-"+(2400+seq)); } }
  });
  txns.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  return { v:1, settings:{shop:"Sri Lakshmi Hardwares", lang:"en", idleDays:30}, products, txns, seq };
}

/* ---------- derived ---------- */
let D = {};
function derive(){
  const stock = {}, lastOut = {}, lastIn = {}, count = {};
  for(const x of S.txns){
    stock[x.pid] = (stock[x.pid]||0) + (x.type==="IN" ? x.qty : -x.qty);
    count[x.pid] = (count[x.pid]||0) + 1;
    if(x.type==="OUT"){ if(!lastOut[x.pid] || x.date > lastOut[x.pid]) lastOut[x.pid] = x.date; }
    else if(!lastIn[x.pid] || x.date > lastIn[x.pid]) lastIn[x.pid] = x.date;
  }
  const N = +S.settings.idleDays || 30;
  let value = 0; const low = [], out = [], idle = [];
  for(const p of S.products){
    const s = stock[p.id] || 0; value += s * p.cost;
    const lo = lastOut[p.id];
    const since = lo ? daysAgo(lo) : (lastIn[p.id] ? daysAgo(lastIn[p.id]) : 0);
    p._s = s; p._lastOut = lo; p._since = since; p._count = count[p.id]||0;
    p._status = s <= 0 ? "out" : s <= p.min ? "low" : "ok";
    p._idle = s > 0 && since >= N;
    if(s <= 0) out.push(p); else if(s <= p.min) low.push(p);
    if(p._idle) idle.push(p);
  }
  low.sort((a,b) => a._s/a.min - b._s/b.min);
  idle.sort((a,b) => b._since - a._since || b._s*b.cost - a._s*a.cost);
  D = { value, low, out, idle, alertCount: low.length + out.length + idle.length };
}

/* ---------- pieces ---------- */
function statusPill(p){
  let h = "";
  if(p._status==="out") h += `<span class="pill p-out">${t("out")}</span>`;
  else if(p._status==="low") h += `<span class="pill p-low">${t("low")}</span>`;
  if(p._idle) h += ` <span class="pill p-idle">${t("idle")} · ${p._since}d</span>`;
  return h;
}
function productRow(p, extra){
  return `<button class="row" data-prod="${p.id}">
    <div class="main"><div class="t">${esc(p.name)}${p.size?` <span style="font-weight:500;color:var(--muted)">· ${esc(p.size)}</span>`:""}</div>
    <div class="s"><span class="brand">${esc(p.brand)}</span><span>${esc(p.cat)}</span>${statusPill(p)}${extra||""}</div></div>
    <div class="r"><div class="qty">${p._s}<small>${esc(p.unit)}</small></div><div class="count">min ${p.min}</div></div></button>`;
}
function txRow(x){
  const p = P(x.pid); if(!p) return "";
  const isIn = x.type==="IN";
  return `<button class="row" data-tx="${x.id}">
    <div class="tx ${isIn?"in":"out"}">${isIn?"IN":"OUT"}</div>
    <div class="main"><div class="t">${esc(p.name)}${p.size?` · ${esc(p.size)}`:""}</div>
    <div class="s"><span>${fmtDate(x.date)}</span><span>${esc(x.party||"")}</span>${x.bill?`<span>#${esc(x.bill)}</span>`:""}</div></div>
    <div class="r"><div class="qty" style="color:var(${isIn?"--in":"--out"})">${isIn?"+":"−"}${x.qty}</div></div></button>`;
}

      </div>
      <div class="field"><label for="ep">${isIn ? t("supplier") : t("customer")}</label><input id="ep" list="parties" autocomplete="off" placeholder="${isIn?"e.g. Pidilite distributor":"e.g. Walk-in customer"}"></div>
      <datalist id="parties">${[...new Set(S.txns.filter(x=>x.type===e.type).map(x=>x.party))].slice(0,30).map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
      <div class="field"><label for="eb">${t("bill")}</label><input id="eb" autocomplete="off"></div>
      <div class="err" id="eerr" hidden></div>
      <div class="btns"><button type="button" class="btn" data-close>${t("cancel")}</button><button type="submit" class="btn primary">${t("save")}</button></div>
    </form>`);
}
function pickList(q){
  q = (q||"").trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  const list = S.products.filter(p => { const h=(p.name+" "+p.size+" "+p.brand+" "+p.cat).toLowerCase(); return words.every(w=>h.includes(w)); }).slice(0,40);
  return list.map(p => `<button class="row" type="button" data-pick="${p.id}"><div class="main"><div class="t">${esc(p.name)}${p.size?" · "+esc(p.size):""}</div><div class="s"><span class="brand">${esc(p.brand)}</span>${statusPill(p)}</div></div><div class="r"><div class="qty">${p._s}</div></div></button>`).join("") || `<div class="empty">No product found. Add it from the Stock tab.</div>`;
}
function saveEntry(){
  const p = P(entry.pid), qty = Math.floor(+document.getElementById("eq").value), date = document.getElementById("ed").value;
  const err = document.getElementById("eerr");
  const fail = m => { err.textContent = m; err.hidden = false; };
  if(!(qty > 0)) return fail("Enter a quantity of 1 or more.");
  if(!date) return fail("Choose a date.");
  if(entry.type==="OUT" && qty > p._s) return fail(`Only ${p._s} ${p.unit} in stock. Record the inward entry first, or reduce the quantity.`);
  const before = p._s;
  S.seq = (S.seq||1) + 1;
  S.txns.push({ id:"t"+S.seq, pid:p.id, type:entry.type, qty, date, party:document.getElementById("ep").value.trim() || (entry.type==="IN"?"Supplier":"Walk-in customer"), bill:document.getElementById("eb").value.trim(), note:"" });
  S.txns.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  persist(); closeSheet(); render();
  const after = P(p.id)._s;
  if(entry.type==="OUT" && after <= p.min){
    const m = after <= 0 ? `${t("out")}: ${p.name} ${p.size}` : `${t("lowMsg")}: ${p.name} ${p.size} — ${after} left (min ${p.min})`;
    toast(m, true); sysNotify(m);
  } else toast(`${entry.type==="IN"?t("inward"):t("outward")} saved · ${p.name} ${entry.type==="IN"?"+":"−"}${qty}`);
}

/* product detail */
let confirmDel = false;
function openProduct(id){
  derive();
  const p = P(id); if(!p) return;
  const hist = S.txns.filter(x=>x.pid===id).slice().reverse();
  openSheet(`
    <div><h3>${esc(p.name)}</h3><div class="count" style="margin-top:4px">${esc(p.brand)} · ${esc(p.cat)}${p.size?" · "+esc(p.size):""}</div></div>
    <div>${statusPill(p) || `<span class="pill p-ok">${t("ok")}</span>`}</div>
    <div class="facts">
      <div class="fact"><div class="l">${t("inStock")}</div><div class="v">${p._s} <span style="font-size:12px;font-weight:500">${esc(p.unit)}</span></div></div>
      <div class="fact"><div class="l">Alert at</div><div class="v">${p.min}</div></div>
      <div class="fact"><div class="l">${t("lastSold")}</div><div class="v" style="font-size:15px">${p._lastOut?fmtDate(p._lastOut):t("never")}</div></div>
      <div class="fact"><div class="l">${t("cost").replace(" ₹","")}</div><div class="v" style="font-size:15px">${rupee(p.cost)}</div></div>
      <div class="fact"><div class="l">${t("price").replace(" ₹","")}</div><div class="v" style="font-size:15px">${rupee(p.price)}</div></div>
      <div class="fact"><div class="l">${t("value")}</div><div class="v" style="font-size:15px">${rupee(p._s*p.cost)}</div></div>
    </div>
    <div class="actions">
      <button class="big in" data-entry="IN" data-pid="${p.id}">${svg("in",22)}<span>${t("inward")}</span></button>
      <button class="big out" data-entry="OUT" data-pid="${p.id}">${svg("out",22)}<span>${t("outward")}</span></button>
    </div>
    <h2>${t("history")} · ${hist.length}</h2>
    <div class="list">${hist.slice(0,30).map(txRow).join("") || `<div class="empty">No entries yet.</div>`}</div>
    <div id="pdel" class="btns"><button class="btn" data-editprod="${p.id}">${t("edit")}</button><button class="btn danger" data-askdel="${p.id}">${t("del")}</button></div>`);
}
function askDelete(id){
  const p = P(id), n = S.txns.filter(x=>x.pid===id).length;
  document.getElementById("pdel").outerHTML = `<div class="confirm" id="pdel">Delete <b>${esc(p.name)} ${esc(p.size)}</b> and its ${n} ${t("entries")}? This cannot be undone.
    <div class="btns"><button class="btn" data-prod="${id}">${t("cancel")}</button><button class="btn danger solid" data-dodel="${id}">${t("del")}</button></div></div>`;
}
function doDelete(id){
  const p = P(id);
  S.products = S.products.filter(x=>x.id!==id); S.txns = S.txns.filter(x=>x.pid!==id);
  persist(); closeSheet(); render(); toast(`Deleted ${p.name}`);
}

/* add / edit product */
function openProductForm(id){
  const p = id ? P(id) : { brand:"", cat:"", name:"", size:"", unit:"Nos", cost:"", price:"", min:5 };
  const brands = [...new Set(S.products.map(x=>x.brand))], cats = [...new Set(S.products.map(x=>x.cat))];
  openSheet(`
    <h3>${id ? t("edit") : t("addProduct")}</h3>
    <form id="pf" data-id="${id||""}" style="display:flex;flex-direction:column;gap:14px">
      <div class="field"><label for="fn">${t("name")}</label><input id="fn" required value="${esc(p.name)}" placeholder="e.g. Asian Paints SmartCare Damp Proof" autofocus></div>
      <div class="grid2">
        <div class="field"><label for="fb">${t("brand")}</label><input id="fb" list="bl" required value="${esc(p.brand)}"></div>
        <div class="field"><label for="fc">${t("cat")}</label><input id="fc" list="cl" value="${esc(p.cat)}"></div>
      </div>
      <datalist id="bl">${brands.map(b=>`<option value="${esc(b)}">`).join("")}</datalist>
      <datalist id="cl">${cats.map(b=>`<option value="${esc(b)}">`).join("")}</datalist>
      <div class="grid2">
        <div class="field"><label for="fs">${t("size")}</label><input id="fs" value="${esc(p.size)}" placeholder="e.g. 20L"></div>
        <div class="field"><label for="fu">${t("unit")}</label><select id="fu">${["Nos","Bag","Box","Kg","Litre","Roll","Set"].map(u=>`<option ${p.unit===u?"selected":""}>${u}</option>`).join("")}</select></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="fcp">${t("cost")}</label><input id="fcp" type="number" inputmode="decimal" min="0" step="0.01" value="${p.cost}"></div>
        <div class="field"><label for="fsp">${t("price")}</label><input id="fsp" type="number" inputmode="decimal" min="0" step="0.01" value="${p.price}"></div>
      </div>
      <div class="field"><label for="fm">${t("min")}</label><input id="fm" type="number" inputmode="numeric" min="0" step="1" required value="${p.min}"></div>
      ${id?"":`<div class="field"><label for="fo">Opening stock</label><input id="fo" type="number" inputmode="numeric" min="0" step="1" value="0"></div>`}
      <div class="btns"><button type="button" class="btn" data-close>${t("cancel")}</button><button type="submit" class="btn primary">${t("saveProduct")}</button></div>
    </form>`);
}
function saveProduct(form){
  const id = form.dataset.id, v = k => document.getElementById(k).value.trim();
  const data = { name:v("fn"), brand:v("fb"), cat:v("fc")||"General", size:v("fs"), unit:v("fu"), cost:+v("fcp")||0, price:+v("fsp")||0, min:Math.max(0,Math.floor(+v("fm")||0)) };
  if(id){ Object.assign(P(id), data); persist(); closeSheet(); render(); toast("Product updated"); openProduct(id); return; }
  const nid = "p" + Date.now().toString(36);
  S.products.unshift({ id:nid, ...data });
  const o = Math.floor(+v("fo")||0);
  if(o > 0){ S.seq++; S.txns.push({ id:"t"+S.seq, pid:nid, type:"IN", qty:o, date:iso(today0()), party:"Opening stock", bill:"", note:"Opening stock" }); }
  persist(); closeSheet(); stockFilter="all"; stockQ=""; go("stock"); toast(`Added ${data.name}`);
}

/* transaction detail */
function openTx(id){
  const x = S.txns.find(y=>y.id===id), p = P(x.pid);
  openSheet(`
    <h3>${x.type==="IN"?t("inward"):t("outward")} · ${x.type==="IN"?"+":"−"}${x.qty} ${esc(p.unit)}</h3>
    <div class="sub">${esc(p.name)}${p.size?" · "+esc(p.size):""}</div>
    <div class="facts">
      <div class="fact"><div class="l">${t("date")}</div><div class="v" style="font-size:15px">${fmtDate(x.date)}</div></div>
      <div class="fact"><div class="l">${t("bill")}</div><div class="v" style="font-size:15px">${esc(x.bill||"—")}</div></div>
      <div class="fact"><div class="l">Value</div><div class="v" style="font-size:15px">${rupee(x.qty*(x.type==="IN"?p.cost:p.price))}</div></div>
    </div>
    <div class="note"><b>${x.type==="IN"?t("supplier"):t("customer")}:</b> ${esc(x.party||"—")}${x.note?`<br><b>${t("note")}:</b> ${esc(x.note)}`:""}</div>
    <div class="btns" id="txdel"><button class="btn" data-prod="${p.id}">Open product</button><button class="btn danger" data-asktx="${id}">${t("del")}</button></div>`);
}

/* ---------- notifications ---------- */
function sysNotify(msg){
  try{
    if(!("Notification" in window) || Notification.permission!=="granted") return;
    const title = S.settings.shop+" · StockBook", opt = { body:msg, icon:"icon-192.png", badge:"icon-192.png", tag:"stockbook" };
    if("serviceWorker" in navigator && navigator.serviceWorker.controller){ navigator.serviceWorker.ready.then(r => r.showNotification(title,opt)).catch(()=>{}); }
    else new Notification(title,opt);
  }catch(e){}
}
async function enableNotify(){
  try{
    if(!("Notification" in window)) throw 0;
    const r = await Notification.requestPermission();
    if(r==="granted"){ toast("Notifications on"); sysNotify(`${D.low.length+D.out.length} low stock · ${D.idle.length} not moving`); }
    else throw 0;
  }catch(e){ toast("Phone notifications work once the app is installed on the phone. In-app alerts are already on."); }
}
function dailyNotify(){
  try{
    const k = "zt-notified", d = iso(today0());
    if(localStorage.getItem(k)===d) return;
    if("Notification" in window && Notification.permission==="granted" && D.alertCount){
      sysNotify(`${D.low.length+D.out.length} products low on stock, ${D.idle.length} not moving`);
      localStorage.setItem(k,d);
    }
  }catch(e){}
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(b.id==="bell") return go("alerts");
  if("contact" in d) return openContact();
  if(d.go){ if(d.filter){ stockFilter=d.filter; stockQ=""; } return go(d.go); }
  if(d.entry) return openEntry(d.entry, d.pid);
  if(d.et){ entry.type = d.et; return drawEntry(); }
  if(d.pick){ entry.pid = d.pick; return drawEntry(); }
  if(b.id==="chg"){ entry.pid = null; return drawEntry(); }
  if(d.prod) return openProduct(d.prod);
  if(d.tx) return openTx(d.tx);
  if(d.close!==undefined && "close" in d) return closeSheet();
  if(d.askdel) return askDelete(d.askdel);
  if(d.dodel) return doDelete(d.dodel);
  if(d.editprod) return openProductForm(d.editprod);
  if("addprod" in d) return openProductForm();
  if(d.asktx){ document.getElementById("txdel").outerHTML = `<div class="confirm" id="txdel">Delete this entry? Stock will be recalculated.<div class="btns"><button class="btn" data-tx="${d.asktx}">${t("cancel")}</button><button class="btn danger solid" data-dotx="${d.asktx}">${t("del")}</button></div></div>`; return; }
  if(d.dotx){ S.txns = S.txns.filter(x=>x.id!==d.dotx); persist(); closeSheet(); render(); return toast("Entry deleted"); }
  if(d.sf){ stockFilter = d.sf; return render(); }
  if(d.sb){ stockBrand = d.sb; return render(); }
  if(d.rf){ regFilter = d.rf; return render(); }
  if(d.rr){ regRange = d.rr; return render(); }
  if(d.lang){ S.settings.lang = d.lang; persist(); return render(); }
  if(b.id==="btnNotify") return enableNotify();
  if(b.id==="btnCsv"){
    const rows = [["Brand","Category","Product","Size","Unit","Stock","Min","Purchase","Selling","Stock value","Last sold","Status"]]
      .concat(S.products.map(p=>[p.brand,p.cat,p.name,p.size,p.unit,p._s,p.min,p.cost,p.price,(p._s*p.cost).toFixed(2),p._lastOut||"",p._status+(p._idle?" / not moving":"")]));
    const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    navigator.clipboard.writeText(csv).then(()=>toast("Stock list copied. Paste it into Excel or Sheets.")).catch(()=>toast("Copy is blocked here. Try in the installed app."));
    return;
  }
  if(b.id==="btnReset"){ document.getElementById("resetBox").innerHTML = `<div class="confirm">Replace all data with fresh demo data?<div class="btns"><button class="btn" data-go="more">${t("cancel")}</button><button class="btn danger solid" id="doReset">${t("reset")}</button></div></div>`; return; }
  if(b.id==="doReset"){ const l = S.settings.lang; S = seed(); S.settings.lang = l; persist(); go("home"); return toast("Demo data reset"); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if(e.target.id==="ef") saveEntry();
  if(e.target.id==="pf") saveProduct(e.target);
});
document.addEventListener("input", e => {
  if(e.target.id==="stockQ"){ stockQ = e.target.value; const tmp = document.createElement("div"); tmp.innerHTML = vStock(); ["stockList","stockCount"].forEach(id => document.getElementById(id).innerHTML = tmp.querySelector("#"+id).innerHTML); }
  if(e.target.id==="pq"){ entry.q = e.target.value; document.getElementById("plist").innerHTML = pickList(entry.q); }
});
document.addEventListener("change", e => {
  if(e.target.id==="setShop"){ S.settings.shop = e.target.value.trim() || "My Hardware Store"; persist(); renderTabs(); toast("Shop name saved"); }
  if(e.target.id==="setIdle"){ S.settings.idleDays = +e.target.value; persist(); render(); toast("Not-moving rule updated"); }
});
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if(VIEWS.includes(h) && h!==view) go(h); });

/* ---------- demo period ---------- */
const DEMO_END = new Date("2026-11-19T23:59:59+05:30").getTime();
const PHONE = "8610212131", PHONE_SHOW = "+91 86102 12131";
const WA_MSG = encodeURIComponent("Hello, I tried the StockBook demo. I'd like the full version for my shop.");
const contactHtml = () => `
  <div class="phone">${PHONE_SHOW}</div>
  <a class="cbtn wa" href="https://wa.me/91${PHONE}?text=${WA_MSG}" target="_blank" rel="noopener">WhatsApp</a>
  <a class="cbtn call" href="tel:+91${PHONE}">Call now</a>
  <div class="count">Manu Brahma · ZorbaTech – Digital Solutions for Small Business</div>`;
function openContact(){
  openSheet(`<div class="contact" style="display:flex;flex-direction:column;gap:14px;text-align:center">
    <h3>Get the full version</h3>
    <div class="sub" style="margin-top:0">All shop phones and the PC share one register, staff logins, alerts even when the app is closed, reports and Excel export.</div>
    ${contactHtml()}
    <button class="btn" data-close>Back to demo</button></div>`);
}
function fmtLeft(ms){
  const d = Math.floor(ms/DAY), h = Math.floor(ms%DAY/36e5), m = Math.floor(ms%36e5/6e4), sec = Math.floor(ms%6e4/1e3);
  return d > 0 ? `${d}d ${String(h).padStart(2,"0")}h ${String(m).padStart(2,"0")}m` : `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}
let locked = false;
function tick(){
  const left = DEMO_END - Date.now();
  if(left <= 0){ if(!locked) lockDemo(); return; }
  document.getElementById("cd").textContent = fmtLeft(left);
  document.getElementById("cdLbl").textContent = S.settings.lang==="ta" ? "டெமோ முடிவு:" : "Demo ends in";
  document.getElementById("timerBar").classList.toggle("urgent", left < DAY);
}
function lockDemo(){
  locked = true; closeSheet();
  document.getElementById("timerBar").hidden = true;
  document.getElementById("lockRoot").innerHTML = `<div class="lock" role="dialog" aria-modal="true"><div class="card">
    <h3>The demo period has ended</h3>
    <div class="sub" style="margin-top:0">Thank you for trying StockBook. Contact us to set up the full version for your shop.</div>
    ${contactHtml()}</div></div>`;
}

/* ---------- boot ---------- */
S = load();
if(!S || S.v!==1) { S = seed(); persist(); }
view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "home";
render();
dailyNotify();
tick(); setInterval(tick, 1000);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
